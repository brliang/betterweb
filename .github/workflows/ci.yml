name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      # Same image and credentials as the Compose db; tests create their own database in it.
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: discovery
          POSTGRES_PASSWORD: discovery
          POSTGRES_DB: discovery
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U discovery -d discovery"
          --health-interval 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Fails when a backend model change wasn't followed by `make codegen`.
  codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make install
      - run: make check-codegen

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: docker build backend
      - run: docker build --file deploy/web.Dockerfile .
      - name: Production compose file is valid
        run: >
          SITE_ADDRESS=ci.example POSTGRES_PASSWORD=x CRAWL_DB_PASSWORD=x SCORE_DB_PASSWORD=x
          API_DB_PASSWORD=x OPENROUTER_API_KEY=x USER_AGENT=x
          docker compose --file deploy/compose.yml config --quiet
