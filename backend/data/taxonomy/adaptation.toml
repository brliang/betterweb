reason = "Service segment."

# Promotion lifts a deeper topic to tier 2 directly under its tier-1 ancestor, for subjects that
# IAB buries too deep for a tiers 1-2 taxonomy. An optional `name` renames it.

[[promote]]
id = "631"  # Technology & Computing > Computing > Programming Languages
name = "Programming"

[[promote]]
id = "618"  # Technology & Computing > Computing > Information and Network Security
name = "Computer Security"

[[promote]]
id = "619"  # Technology & Computing > Computing > Internet

[[promote]]
id = "602"  # Technology & Computing > Computing > Computer Software and Applications
name = "Software"

[[promote]]
id = "61"  # Business and Finance > Business > Startups

# Additions fill gaps in IAB for subjects people read about. IDs start with `x-` so they can
# never collide with IAB IDs. `parent` is an IAB or `x-` ID, or omitted for a tier-1 topic.

[[add]]
id = "x-history"
name = "History"

[[add]]
id = "x-philosophy"
name = "Philosophy"

[[add]]
id = "x-mathematics"
name = "Mathematics"
parent = "464"  # Science
