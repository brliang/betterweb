[project]
name = "discovery-engine"
version = "0.1.0"
description = "Graph-centric, transparent content discovery engine (backend)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.141.1",
    "feedparser>=6.0.14",
    "httpx2>=2.13.0",
    "numpy>=2.5.3",
    "pgvector>=0.5.0",
    "protego>=0.7.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "scipy>=1.18.1",
    "sqlalchemy[asyncio]>=2.0.54",
    "trafilatura>=2.2.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "scipy-stubs>=1.18.1.1",
    "types-defusedxml>=0.7.0",
    "types-lxml>=2026.2.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import sorting
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM", "C4", "RET", "PTH",  # simplify, comprehensions, returns, pathlib
    "RUF",
    "ASYNC",        # blocking calls in async code
    "DTZ",          # timezone-naive datetimes
    "S",            # bandit security checks
    "T20",          # print(); use logging
    "TID",          # banned (relative parent) imports
    "FAST",         # FastAPI idioms (Annotated dependencies, redundant response_model)
    "PT",           # pytest style
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["app", "migrations", "scripts", "tests"]
explicit_package_bases = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
markers = ["db: needs Postgres (`docker compose up -d db`); added to everything in tests/db/"]
filterwarnings = [
    "error",
    # Upstream (starlette 1.6.0 TestClient): remove once starlette stops using the old alias.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["."]
# Files are named <rev>_<slug>.py; `make migration` passes sequential rev IDs (0001, 0002, ...).

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_fix"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"
