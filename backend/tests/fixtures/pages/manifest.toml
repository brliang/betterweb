# Real pages saved with `uv run python -m scripts.capture_page URL NAME` (bodies are NAME.gz),
# for the extraction tests. Each is redistributable under the license noted; `expected` holds
# what the classifier and extractors must produce for it. Optional expectations, checked only
# when present: author, published (a date), contains (a phrase of the main text),
# excerpt_start and min_links.

[[page]]
name = "wikipedia_pagerank"
url = "https://en.wikipedia.org/wiki/PageRank"
content_type = "text/html"
charset = "utf-8"
fetched_at = "2026-09-23"
license = "CC BY-SA 4.0 (Wikipedia contributors)"

[page.expected]
type = "article"
classifier = "schema_org"
title = "PageRank"
language = "en"
published = "2001-11-05"
contains = "PageRank (PR) is an algorithm used by Google Search to rank web pages"
min_words = 5000
min_links = 300

[[page]]
name = "wikipedia_talk_pagerank"
url = "https://en.wikipedia.org/wiki/Talk:PageRank"
content_type = "text/html"
charset = "utf-8"
fetched_at = "2026-09-23"
license = "CC BY-SA 4.0 (Wikipedia contributors)"

[page.expected]
type = "thread"
classifier = "url"
title = "Talk:PageRank"
language = "en"
contains = "External links modified"
min_words = 1000
min_links = 100

