services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: discovery
      POSTGRES_PASSWORD: discovery
      POSTGRES_DB: discovery
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discovery -d discovery"]
      interval: 2s
      retries: 30

  # Applies migrations, then exits; api and worker start after it succeeds.
  migrate:
    build: ./backend
    command: alembic upgrade head
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://discovery:discovery@db:5432/discovery
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Not long-running: invoke with `docker compose run --rm worker cycle run`.
  worker:
    build: ./backend
    entrypoint: ["python", "-m", "app.worker"]
    environment: *backend-env
    profiles: [worker]
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
